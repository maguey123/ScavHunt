name: superscav
description: "A scavenger hunt game built with Flutter and Firebase."
publish_to: 'none'

version: 1.0.3+3

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  image_picker: ^1.1.1
  flutter_launcher_icons: ^0.13.1
  firebase_app_check: ^0.3.0

  # Maps and geolocation
  google_maps_flutter: ^2.6.1
  geolocator: ^11.1.0
  geocoding: ^3.0.0

  cupertino_icons: ^1.0.8
  dio: ^5.4.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.3
  file_picker: ^8.1.2
  share_plus: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/icons/super_scav_adaptive_foreground.png
    - assets/icons/super_scav_adaptive_background.png
    - assets/icons/super_scav_monochrome.png
    - assets/icons/super_scav_ios_marketing.png

# ──────────────────────────────
# App Icon Configuration
# ──────────────────────────────
flutter_icons:
  android: "adaptive"
  ios: true

  # 👇 This fixes the error
  image_path: assets/icons/super_scav_ios_marketing.png

  # iOS
  image_path_ios: assets/icons/super_scav_ios_marketing.png
  remove_alpha_ios: true

  # Android adaptive
  adaptive_icon_foreground: assets/icons/super_scav_adaptive_foreground.png
  adaptive_icon_background: assets/icons/super_scav_adaptive_background.png
  adaptive_icon_monochrome: assets/icons/super_scav_monochrome.png

  android_icon_name: ic_launcher
